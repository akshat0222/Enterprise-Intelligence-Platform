name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-intel/backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: enterprise_intel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d enterprise_intel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/enterprise_intel
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: enterprise-intel/backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1
        working-directory: .
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        # The suite uses fake LLM providers and the offline embedder; no API keys are needed.
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-intel/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5500
